---
layout: default
---
<main id="main" class="content-shell collection-page">
  <header class="page-heading">
    <p class="eyebrow">{{ page.eyebrow | default: 'From the archive' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </header>
  {{ content }}
</main>
